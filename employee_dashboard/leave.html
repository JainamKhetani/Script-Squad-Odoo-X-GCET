<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DayFlow HR | Leave & Attendance</title>

<style>
:root{
    --primary:#4A70A9;
    --secondary:#8FABD4;
    --bg:#EFECE3;
    --white:#FFFFFF;
    --black:#000000;
    --green:#2ecc71;
    --orange:#f39c12;
    --red:#e74c3c;
}

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Tahoma,sans-serif;
}

body{ background:var(--bg); }

.wrapper{
    display:flex;
    height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:320px;
    padding:25px 22px;
}

.sidebar-panel{
    background:var(--white);
    border-radius:20px;
    box-shadow:0 12px 30px rgba(0,0,0,0.12);
    overflow:hidden;
}

.sidebar-header{
    background:var(--primary);
    padding:28px;
    font-size:26px;
    font-weight:800;
    color:#fff;
}

.sidebar-menu{
    padding:28px;
}

.sidebar-menu a{
    display:flex;
    gap:14px;
    padding:16px;
    margin-bottom:14px;
    border-radius:14px;
    text-decoration:none;
    color:#000;
    font-weight:500;
}

.sidebar-menu a.active,
.sidebar-menu a:hover{
    background:var(--secondary);
}

/* MAIN */
.main{
    flex:1;
    background:var(--primary);
    padding:25px;
    overflow-y:auto;
}

.main-content{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:25px;
}

/* TOPBAR */
.topbar{
    background:var(--white);
    padding:18px 28px;
    border-radius:18px;
    display:flex;
    justify-content:space-between;
}

/* CARD */
.card{
    background:var(--white);
    border-radius:20px;
    padding:28px;
    box-shadow:0 12px 30px rgba(0,0,0,0.15);
}

.card h3{
    margin-bottom:18px;
    color:var(--primary);
}

/* FORMS */
label{
    font-size:14px;
    font-weight:600;
}

input, select, textarea{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:10px;
    border:1px solid #ccc;
}

textarea{ resize:none; }

button{
    padding:12px 20px;
    border:none;
    border-radius:20px;
    background:var(--primary);
    color:#fff;
    cursor:pointer;
    font-weight:600;
}

button:hover{ background:#365a8c; }

/* GRID */
.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

/* STATUS BADGES */
.badge{
    padding:6px 14px;
    border-radius:20px;
    color:#fff;
    font-size:13px;
}

.pending{ background:var(--orange); }
.approved{ background:var(--green); }
.rejected{ background:var(--red); }

/* ATTENDANCE */
.attendance-actions{
    display:flex;
    gap:20px;
}

.status-box{
    font-weight:700;
    font-size:18px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-panel">
        <div class="sidebar-header">DayFlow<span>HR</span></div>
        <div class="sidebar-menu">
            <a href="employee-dashboard.html">🏠 Dashboard</a>
            <a href="myprofile.html">👤 My Profile</a>
            <a class="active">📝 Leave & Attendance</a>
            <a href="salary.html">💰 Salary</a>
            <a href="../login.html">🚪 Logout</a>

        </div>
    </div>
</aside>

<!-- MAIN -->
<main class="main">
<div class="main-content">

<!-- TOPBAR -->
<div class="topbar">
    <strong>Leave Requests & Attendance</strong>
    <span>Employee John</span>
</div>

<!-- CHECK IN / OUT -->
<div class="card">
    <h3>Attendance</h3>

    <div class="attendance-actions">
        <button onclick="checkIn()">Check In</button>
        <button onclick="checkOut()">Check Out</button>
        <div class="status-box" id="attendanceStatus">Status: Absent</div>
    </div>
</div>

<!-- LEAVE REQUEST FORM -->
<div class="card">
    <h3>Apply Leave</h3>

    <div class="grid-2">
        <div>
            <label>Leave Type</label>
            <select id="leaveType">
                <option>Paid</option>
                <option>Sick</option>
                <option>Unpaid</option>
            </select>
        </div>

        <div>
            <label>From Date</label>
            <input type="date" id="fromDate">
        </div>

        <div>
            <label>To Date</label>
            <input type="date" id="toDate">
        </div>

        <div>
            <label>Remarks</label>
            <textarea rows="3" id="remarks"></textarea>
        </div>
    </div>

    <br>
    <button onclick="submitLeave()">Submit Leave Request</button>
</div>

<!-- LEAVE HISTORY -->
<div class="card">
    <h3>Leave Requests</h3>

    <table id="leaveTable">
        <tr>
            <th>Type</th>
            <th>Duration</th>
            <th>Remarks</th>
            <th>Status</th>
        </tr>
    </table>
</div>

</div>
</main>
</div>

<script>
let checkedIn = false;

function checkIn(){
    checkedIn = true;
    document.getElementById("attendanceStatus").innerText = "Status: Present";
}

function checkOut(){
    if(checkedIn){
        document.getElementById("attendanceStatus").innerText = "Status: Half-day";
    }
}

function submitLeave(){
    const type = leaveType.value;
    const from = fromDate.value;
    const to = toDate.value;
    const remark = remarks.value;

    const row = `
        <tr>
            <td>${type}</td>
            <td>${from} → ${to}</td>
            <td>${remark}</td>
            <td><span class="badge pending">Pending</span></td>
        </tr>
    `;
    document.getElementById("leaveTable").innerHTML += row;
}
</script>

</body>
</html>
