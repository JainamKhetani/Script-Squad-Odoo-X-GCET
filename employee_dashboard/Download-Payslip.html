<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .card{
    background: var(--white);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.card h3{
    margin-bottom: 20px;
    color: var(--primary);
}

.download-btn{
    padding: 8px 16px;
    background: var(--primary);
    color: #fff;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
}

.download-btn:hover{
    background: #365a8c;
}

*{
    font-family: "Segoe UI", Tahoma, sans-serif;
}

body{
    background: var(--bg);
}

:root{
    --primary: #4A70A9;
    --secondary: #8FABD4;
    --bg: #EFECE3;
    --white: #FFFFFF;
    --black: #000000;
}

.card{
    text-align: center;
}


    </style>
</head>


<body>
    
<div class="card">
    <h3>Payslip</h3>
    <p>You can download your payslip for official use.</p>
    <br>
    <button onclick="downloadPayslip()" class="download-btn">📄 Download Payslip (PDF)</button>
</div>

<script>
function downloadPayslip(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(18);
    doc.text("DayFlow HR - Payslip", 20, 20);

    doc.setFontSize(12);
    doc.text("Employee Name: John Doe", 20, 40);
    doc.text("Employee ID: EMP1023", 20, 50);
    doc.text("Department: Engineering", 20, 60);
    doc.text("Pay Month: July 2025", 20, 70);

    doc.line(20, 75, 190, 75);

    doc.text("Earnings", 20, 85);
    doc.text("Basic Salary: ₹25,000", 20, 95);
    doc.text("HRA: ₹3,000", 20, 105);
    doc.text("Bonus: ₹2,000", 20, 115);

    doc.text("Deductions", 20, 130);
    doc.text("PF: ₹1,200", 20, 140);
    doc.text("Professional Tax: ₹800", 20, 150);

    doc.line(20, 160, 190, 160);

    doc.setFontSize(14);
    doc.text("Net Pay: ₹28,000", 20, 175);

    doc.setFontSize(10);
    doc.text("This is a system generated payslip.", 20, 190);

    doc.save("Payslip_July_2025.pdf");
}
</script>

</body>
</html>
